<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Fond : violet profond → magenta -->
    <linearGradient id="bg" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8A3FFC"/>
      <stop offset="0.55" stop-color="#C02FD8"/>
      <stop offset="1" stop-color="#FF3D9A"/>
    </linearGradient>
    <!-- Reflet en haut à gauche -->
    <radialGradient id="shine" cx="0.28" cy="0.18" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- Lueur intérieure en bas -->
    <radialGradient id="glow" cx="0.5" cy="1" r="0.7">
      <stop offset="0" stop-color="#FFB3E6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFB3E6" stop-opacity="0"/>
    </radialGradient>
    <!-- Éclair : blanc nacré -->
    <linearGradient id="bolt" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE0F5"/>
    </linearGradient>
    <!-- Anneau de vitesse -->
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#4A0A6B" flood-opacity="0.45"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#5B1A8C" flood-opacity="0.22"/>
    </filter>
    <clipPath id="sq"><rect x="72" y="72" width="880" height="880" rx="232"/></clipPath>
  </defs>

  <!-- Squircle -->
  <g filter="url(#outer)">
    <rect x="72" y="72" width="880" height="880" rx="232" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#sq)">
    <rect x="72" y="72" width="880" height="880" fill="url(#glow)"/>
    <rect x="72" y="72" width="880" height="880" fill="url(#shine)"/>
    <!-- Bord lumineux -->
    <rect x="76" y="76" width="872" height="872" rx="228" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6"/>
  </g>

  <!-- Anneau de vitesse (arc de jauge) + graduations -->
  <g fill="none" stroke-linecap="round">
    <path d="M 286 676 A 260 260 0 1 1 738 676" stroke="#ffffff" stroke-opacity="0.18" stroke-width="44"/>
    <path d="M 286 676 A 260 260 0 0 1 690 280" stroke="url(#ring)" stroke-width="44"/>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.5" stroke-width="12" stroke-linecap="round">
    <line x1="512" y1="214" x2="512" y2="244"/>
    <line x1="302" y1="301" x2="323" y2="322"/>
    <line x1="722" y1="301" x2="701" y2="322"/>
  </g>

  <!-- Éclair -->
  <g filter="url(#shadow)">
    <path d="M 566 236 L 352 556 L 492 556 L 446 800 L 676 452 L 534 452 Z" fill="url(#bolt)"/>
  </g>
  <!-- Étincelle -->
  <path d="M 770 196 L 786 240 L 830 256 L 786 272 L 770 316 L 754 272 L 710 256 L 754 240 Z" fill="#ffffff" fill-opacity="0.92"/>
</svg>
